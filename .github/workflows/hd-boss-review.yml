name: Seven-boss visual QA studio
on:
  push:
    branches: [feature/hd-seven-boss-visual-qa-20261122]
    paths:
      - 'game/hd-boss-review*'
      - 'game/tests/hd-boss-review.test.mjs'
      - 'game/tests/hd-boss-final-four-intake.test.mjs'
      - 'game/tools/hd-boss-review-browser-smoke.py'
      - 'game/package.json'
      - '.github/workflows/hd-boss-review.yml'
  pull_request:
    paths:
      - 'game/hd-boss-review*'
      - 'game/tests/hd-boss-review.test.mjs'
      - 'game/tests/hd-boss-final-four-intake.test.mjs'
      - 'game/tools/hd-boss-review-browser-smoke.py'
      - 'game/package.json'
      - '.github/workflows/hd-boss-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seven-boss-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all seven source paintings, motion manifests, receipts, and pending states
        run: |
          node --test game/tests/hd-boss-review.test.mjs \
            game/tests/hd-boss-final-four-intake.test.mjs \
            game/tests/hd-seven-named-boss-art-git.test.mjs
          (cd game && npm run check)
      - name: Install real-browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify all seven visually served, produce PNG / JSON evidence
        run: python game/tools/hd-boss-review-browser-smoke.py
      - name: Upload browser-rendered QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jrpg-seven-boss-qa-evidence
          path: artifacts/hd-boss-review/
          if-no-files-found: warn
          retention-days: 14
