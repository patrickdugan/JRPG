name: HD boss windup to active seam audit
on:
  push:
    branches: [feature/hd-windup-active-seam-audit-20261122]
    paths:
      - 'game/tools/hd-boss-attack-seam-audit.py'
      - 'game/tools/test_hd_boss_attack_seam_audit.py'
      - '.github/workflows/hd-boss-attack-seam-audit.yml'
  pull_request:
    paths:
      - 'game/tools/hd-boss-attack-seam-audit.py'
      - 'game/tools/test_hd_boss_attack_seam_audit.py'
      - '.github/workflows/hd-boss-attack-seam-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase-boundary-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audited image dependencies
        run: python -m pip install 'pillow>=11,<13' 'numpy>=2,<3'
      - name: Test identical, displaced and invisible-RGB seam controls
        run: python -m unittest discover -s game/tools -p test_hd_boss_attack_seam_audit.py -v
      - name: Rebuild candidate windups and audit original attack cutovers
        run: python game/tools/hd-boss-attack-seam-audit.py --root . --output-dir artifacts/hd-boss-attack-seams
      - name: Check original art and canonical approval retained
        run: |
          node --test game/tests/hd-seven-named-boss-art-git.test.mjs
          git diff --exit-code -- assets/art game/assets/art/hd-painted-v1
      - name: Include exact original active WebPs for independent visual inspection
        run: |
          mkdir -p artifacts/hd-boss-attack-seams/original-active-reference
          cp game/assets/art/hd-painted-v1/motion/yearless-bell/active.webp artifacts/hd-boss-attack-seams/original-active-reference/yearless-bell-active.webp
          cp game/assets/art/hd-painted-v1/motion/lady-enma/active.webp artifacts/hd-boss-attack-seams/original-active-reference/lady-enma-active.webp
          sha256sum artifacts/hd-boss-attack-seams/original-active-reference/* > artifacts/hd-boss-attack-seams/original-active-reference/SHA256SUMS
      - name: Upload exact transition GIFs, full contact sheets, perceptual scores and candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrpg-hd-two-boss-windup-active-handoff
          path: artifacts/hd-boss-attack-seams/
          retention-days: 14
          if-no-files-found: warn
