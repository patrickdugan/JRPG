name: HD boss active-effect anticipation previews
on:
  push:
    branches: [feature/hd-active-effect-leadin-20261122]
    paths:
      - 'game/tools/hd-boss-active-effect-leadin.py'
      - 'game/tools/test_hd_boss_active_effect_leadin.py'
      - '.github/workflows/hd-boss-active-effect-leadin.yml'
  pull_request:
    paths:
      - 'game/tools/hd-boss-active-effect-leadin.py'
      - 'game/tools/test_hd_boss_active_effect_leadin.py'
      - '.github/workflows/hd-boss-active-effect-leadin.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anticipation-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow and NumPy
        run: python -m pip install 'pillow>=11,<13' 'numpy>=2,<3'
      - name: Test colored effects, protected figures and unchanged early windups
        run: python -m unittest discover -s game/tools -p test_hd_boss_active_effect_leadin.py -v
      - name: Render verified release-effect lead-in WebPs and compare seams
        run: python game/tools/hd-boss-active-effect-leadin.py --root . --output-dir artifacts/hd-active-effect-leadin
      - name: Verify seven-boss original artwork and Roster Keystone unchanged
        run: |
          node --test game/tests/hd-seven-named-boss-art-git.test.mjs
          git diff --exit-code -- assets/art game/assets/art/hd-painted-v1
      - name: Upload two review-only WebPs, transition GIFs, effect masks and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrpg-two-boss-effect-anticipation-preview
          path: artifacts/hd-active-effect-leadin/
          retention-days: 14
          if-no-files-found: warn
