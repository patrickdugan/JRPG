name: JRPG late-boss gameplay integration gate
on:
  push:
    branches: [feature/boss-counterplay-coaching-20261122]
    paths:
      - 'game/action-battle-coaching.mjs'
      - 'game/tests/action-battle-coaching.test.mjs'
      - 'game/tools/late-boss-gameplay-smoke.py'
      - '.github/workflows/jrpg-late-boss-gameplay.yml'
  pull_request:
    paths:
      - 'game/action-battle-coaching.mjs'
      - 'game/tests/action-battle-coaching.test.mjs'
      - 'game/tools/late-boss-gameplay-smoke.py'
      - '.github/workflows/jrpg-late-boss-gameplay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  late-boss-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the game source and existing battle contract
        working-directory: game
        run: |
          npm run check
          npm test
      - name: Install Chromium for the actual Action Campaign
        run: |
          python -m pip install 'playwright>=1.55,<1.59'
          python -m playwright install --with-deps chromium
      - name: Exercise authored Chapter 3-9 bosses and capture actual attack warnings
        run: |
          python game/tools/late-boss-gameplay-smoke.py --virtual-ms 18000 --strict-telegraphs
      - name: Verify source art and canonical roster remained byte-identical
        if: always()
        run: |
          git diff --exit-code -- assets/art/roster-keystone/
          git diff --exit-code -- game/assets/art/hd-painted-v1/
      - name: Upload eight-encounter gameplay evidence and canvas screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrpg-late-boss-gameplay-lab
          path: artifacts/late-boss-gameplay/
          if-no-files-found: warn
          retention-days: 14
