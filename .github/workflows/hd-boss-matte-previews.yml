name: Reversible boss matte comparison previews
on:
  push:
    branches: [feature/hd-matte-repair-previews-20261122]
    paths:
      - 'game/tools/hd-boss-matte-proposals.py'
      - 'game/tools/test_hd_boss_matte_proposals.py'
      - '.github/workflows/hd-boss-matte-previews.yml'
  pull_request:
    paths:
      - 'game/tools/hd-boss-matte-proposals.py'
      - 'game/tools/test_hd_boss_matte_proposals.py'
      - '.github/workflows/hd-boss-matte-previews.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matte-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pillow>=11,<13'
      - name: Synthetic guard tests for alpha and intentional costume preservation
        run: python -m unittest discover -s game/tools -p test_hd_boss_matte_proposals.py -v
      - name: Generate matte proposals only into untracked CI artifacts
        run: python game/tools/hd-boss-matte-proposals.py --root . --output-dir artifacts/hd-boss-matte-proposals
      - name: Original source paintings, runtime atlases, roster and imports must remain unchanged
        run: git diff --exit-code -- assets/art game/assets/art/hd-painted-v1
      - name: Upload before/after comparisons, hotspot masks and candidate-only PNGs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jrpg-four-boss-nonruntime-matte-previews
          path: artifacts/hd-boss-matte-proposals/
          retention-days: 14
          if-no-files-found: warn
