name: HD painted art integration and original game regression
on:
  push:
    branches:
      - feature/hd-painted-engine-integration
  pull_request:
    paths:
      - 'game/hd-painted-animation.mjs'
      - 'game/action-campaign-battle.js'
      - 'game/tests/hd-painted-animation.test.mjs'
      - 'game/tools/hd-painted-browser-smoke.py'
      - 'game/tools/install-hd-painted-art.py'
      - 'game/assets/art/hd-painted-v1/**'
      - '.github/workflows/hd-painted-engine.yml'
  workflow_dispatch:

jobs:
  painted-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all game JavaScript syntax
        run: cd game && npm run check
      - name: Verify six-key pose selection and fallback contracts
        run: node --test game/tests/hd-painted-animation.test.mjs
      - name: Install original art-builder dependency
        run: python -m pip install 'pillow==11.3.0'
      - name: Verify action battle and painted-art integration contracts
        run: |
          node --test game/tests/hd-painted-animation.test.mjs game/tests/action-campaign-battle-source.test.mjs game/tests/action-campaign-battle-model.test.mjs game/tests/action-campaign-routing.test.mjs game/tests/action-campaign-settlement.test.mjs
      - name: Check original full Node suite (existing PNG byte-identity baseline)
        continue-on-error: true
        run: |
          cd game
          set -o pipefail
          npm test 2>&1 | tee ../full-game-test-report.txt
      - name: Install browser fixtures and Chromium
        run: |
          python -m pip install 'pillow==11.3.0' 'playwright>=1.55,<1.59'
          python -m playwright install --with-deps chromium
      - name: Verify painted and classic runtime rendering
        run: python game/tools/hd-painted-browser-smoke.py
      - name: Preserve actual browser art evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrpg-hd-painted-engine-smoke
          path: |
            artifacts/painted-action-campaign.png
            artifacts/classic-action-campaign.png
            full-game-test-report.txt
          if-no-files-found: ignore
