name: Gothic SVG animation source and browser validation
on:
  push:
    branches:
      - feature/svg-gothic-animation-cells
  pull_request:
    paths:
      - 'assets/art/svg-cel-suite-v1/**'
      - 'game/svg-motion-studio*'
      - 'game/tools/svg-motion-browser-smoke.py'
      - 'game/index.html'
      - 'docs/46-svg-motion-cells.md'
      - '.github/workflows/svg-motion-cells.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svg-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vector-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and browser QA libraries
        run: |
          python -m pip install 'cairosvg>=2.7,<3' 'pillow>=11,<13' 'playwright>=1.55,<1.59'
          python -m playwright install --with-deps chromium
      - name: Generate all vector SVG sheets and source manifest
        run: python assets/art/svg-cel-suite-v1/build.py
      - name: Verify source, individual cels, pixels and reproducibility
        run: |
          python -m unittest discover -s assets/art/svg-cel-suite-v1/tests -v
          python assets/art/svg-cel-suite-v1/build.py --check
      - name: Compile browser JavaScript
        run: cd game && npm run check
      - name: Render complete cast contact sheet
        run: python assets/art/svg-cel-suite-v1/make_contact.py
      - name: Real Chromium animation studio acceptance
        run: python game/tools/svg-motion-browser-smoke.py
      - name: Preserve full roster and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svg-gothic-full-roster-review
          path: |
            artifacts/svg-gothic-full-roster.png
            artifacts/svg-motion-studio.png
          if-no-files-found: ignore
      - name: Commit deterministic SVG source sheets back to art branch
        if: github.event_name == 'push' && github.ref_name == 'feature/svg-gothic-animation-cells'
        run: |
          git add assets/art/svg-cel-suite-v1/sheets assets/art/svg-cel-suite-v1/manifest.json game/assets/art/svg-cel-suite-v1/sheets game/assets/art/svg-cel-suite-v1/manifest.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'art: compile 69 Gothic SVG strips and 686 pose cells'
            git push origin HEAD:feature/svg-gothic-animation-cells
          fi
