name: Commit premium HD boss source and motion binaries
on:
  push:
    branches: [feature/hd-final-boss-binary-import-20261121]
    paths:
      - 'assets/art/hd-boss-binary-import-v1/**'
      - 'game/tools/hydrate-hd-boss-binary-packages.py'
      - '.github/workflows/hd-final-boss-import.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jrpg-hd-boss-import-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for exact image validation
        run: python -m pip install 'pillow>=11,<13'
      - name: Verify every Git chunk and reconstruct original boss ZIPs
        run: python game/tools/hydrate-hd-boss-binary-packages.py --extract-dir "$RUNNER_TEMP/hd-boss-zips" --require-complete --import-check
      - name: Check source receipts and animation coverage
        run: |
          node --test game/tests/hd-boss-final-four-intake.test.mjs game/tests/hd-boss-art-intakes.test.mjs game/tests/hd-boss-binary-manifest.test.mjs
          cd game && npm run check
      - name: Import three real image packs as separate small commits
        if: github.ref_name == 'feature/hd-final-boss-binary-import-20261121'
        env:
          HD_BRANCH: feature/hd-final-boss-binary-import-20261121
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$HD_BRANCH"
          python game/tools/import-hd-boss-pack.py "$RUNNER_TEMP/hd-boss-zips/JRPG_HD_Boss_lady_enma_v2.zip" --commit --push
          python game/tools/import-hd-boss-pack.py "$RUNNER_TEMP/hd-boss-zips/JRPG_HD_Boss_bell_warden_chiyo_v2.zip" --commit --push
          python game/tools/import-hd-boss-pack.py "$RUNNER_TEMP/hd-boss-zips/JRPG_HD_Boss_yearless_bell_v2.zip" --commit --push
      - name: Verify finished manifests and source-preserving Git imports
        run: |
          python game/tools/hydrate-hd-boss-binary-packages.py --require-complete
          node --test game/tests/hd-boss-final-four-intake.test.mjs game/tests/hd-boss-art-intakes.test.mjs game/tests/hd-boss-binary-manifest.test.mjs
