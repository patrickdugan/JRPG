name: Seven-boss optical diagnostics
on:
  push:
    branches: [feature/hd-boss-optical-diagnostics-20261122]
    paths:
      - 'game/tools/hd-boss-art-diagnostics.py'
      - 'game/tools/test_hd_boss_art_diagnostics.py'
      - '.github/workflows/hd-boss-optical-diagnostics.yml'
  pull_request:
    paths:
      - 'game/tools/hd-boss-art-diagnostics.py'
      - 'game/tools/test_hd_boss_art_diagnostics.py'
      - '.github/workflows/hd-boss-optical-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  optical-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for the committed source artwork
        run: python -m pip install 'pillow>=11,<13'
      - name: Test synthetic alpha and animation measurements
        run: python -m unittest discover -s game/tools -p test_hd_boss_art_diagnostics.py -v
      - name: Audit all seven committed originals and 1680 decoded motion frames
        run: |
          python game/tools/hd-boss-art-diagnostics.py --root . --output-dir artifacts/hd-boss-optical-diagnostics
      - name: Check no source art or canonical approval was modified
        run: |
          git diff --exit-code -- assets/art/roster-keystone/roster.json game/assets/art/hd-painted-v1 assets/art/hd-painted-boss-review-v1
      - name: Upload numerical QA metrics and seven matte contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrpg-seven-boss-optical-diagnostics
          path: artifacts/hd-boss-optical-diagnostics/
          retention-days: 14
          if-no-files-found: warn
